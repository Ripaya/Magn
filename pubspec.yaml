name: magn
description: Magn — A minimalist Kinetic Focus Dial & Pomodoro app for Android built around a 3-layer mechanical dial.
publish_to: 'none'
version: 0.1.0-a+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.1
  path: ^1.9.1
  intl: ^0.20.1
  uuid: ^4.5.1
  wakelock_plus: ^1.2.8
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
