name: magn
description: Magn — A minimalist Kinetic Focus Dial & Pomodoro app for Android built around a 3-layer mechanical dial.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.1
  path: ^1.9.1
  intl: ^0.20.1
  uuid: ^4.5.1
  wakelock_plus: ^1.2.8
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
